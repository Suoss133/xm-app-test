pages:
  login:
    # 区域
    region_button: (AppiumBy.ID, "com.xm.support.android:id/tv_region")
    # 地区输入框
    region_input: (AppiumBy.ID, "com.xm.support.android:id/et_search")
    # 选择地区
    region_select: (AppiumBy.XPATH, '//android.widget.TextView[@resource-id="com.xm.support.android:id/tv_city_name" and @text="{}"]')
    # 用户邮箱
    email_input: (AppiumBy.XPATH, '//android.widget.EditText[@text="输入您的邮箱"]')
    # 用户密码
    password_input: (AppiumBy.XPATH, "//android.widget.EditText[@text='输入密码']")
    # 记住密码
    remember_password: (AppiumBy.ID, "com.xm.support.android:id/iv_keep_password")
    # 忘记密码
    forget_password: (AppiumBy.ID, "com.xm.support.android:id/tv_forgot_password")
    # 登录按钮
    login_button: (AppiumBy.ID, "com.xm.support.android:id/text_login_button")
    # 注册账号
    register_account: (AppiumBy.ID, "com.xm.support.android:id/text_login_to_register")
    # 同意协议
    user_agree: (AppiumBy.ID, "com.xm.support.android:id/btn_selector_pir")
    # 邮箱格式错误信息
    email_error_message: (AppiumBy.ID, "com.xm.support.android:id/tv_error")
    # 系统弹窗提示信息
    system_window_message: (AppiumBy.ID, "com.xm.support.android:id/tv_text")
    # 关闭系统弹窗
    close_system_window: (AppiumBy.ID, "com.xm.support.android:id/tv_confirm")
    # 使用权限信息
    permission_allow: (AppiumBy.ID, "com.android.permissioncontroller:id/permission_allow_foreground_only_button")
  home:
    # 首页唯一标识
    home_page_identifier: (AppiumBy.ID, "com.xm.support.android:id/text_home_my_family")
    # 添加设备
    add_device_button: (AppiumBy.ID, "com.xm.support.android:id/image_home_top_right2")
    # 设置
    setting_device_button:
      (
      AppiumBy.XPATH,
      '//android.widget.TextView[contains(@resource-id, "title") and @text="{}"]'
      '/ancestor::android.widget.FrameLayout[1]'
      '//android.view.ViewGroup[@resource-id="com.xm.support.android:id/layout_setting"]'
      '/android.widget.ImageView[@resource-id="com.xm.support.android:id/iv_setting"]'
      )

    # 视频播放
    live_button: (AppiumBy.XPATH, '//android.widget.TextView[contains(@resource-id, "title") and @text="{}"]/ancestor::android.widget.FrameLayout[1]//android.widget.ImageView[@resource-id="com.xm.support.android:id/iv_play_status"]')
    # 事件
    event_button: (AppiumBy.XPATH,'//android.widget.TextView[@text="事件"]')
    # 发现新设备弹窗标识
    find_new_device_popup: (AppiumBy.XPATH, '/android.widget.TextView[@text="发现新设备"]')
    # 发现新设备弹窗中的设备列表名称
    popup_device_list: (AppiumBy.XPATH, "//android.widget.TextView[@resource-id='com.xm.support.android:id/tv_name']")
    # 发现新设备弹窗中的设备添加按钮
    popup_add_device_list: (AppiumBy.XPATH, "//android.widget.TextView[@resource-id='com.xm.support.android:id/tv_add']")
    # 用户按钮
    user_button: (AppiumBy.ID, "com.xm.support.android:id/iv_tab5")
    # 用户名称
    user_name: (AppiumBy.ID, "com.xm.support.android:id/tv_user_name")
    # 单个关闭弹窗
    close_popup: (AppiumBy.ID, "com.xm.support.android:id/tv_confirm")

  add_device:
    # 加载状态：
    loading: (AppiumBy.ID, "com.xm.support.android:id/lav_loading")
    # 选择蓝牙设备SN
    select_bluetooth_device_sn: (AppiumBy.XPATH, '//android.widget.TextView[@resource-id="com.xm.support.android:id/tv_dev_name" and @text="{}"]')
    # 找不到二维码？点击这里
    no_find_no_qr_code_button: (AppiumBy.ID, "com.xm.support.android:id/tv_manual_enter_sn")
    # 设备类型
    device_type: (AppiumBy.XPATH,'//androidx.recyclerview.widget.RecyclerView[@resource-id="com.xm.support.android:id/recycler_view_service"]//android.widget.LinearLayout[contains(@clickable, "true") and .//android.widget.TextView[@resource-id="com.xm.support.android:id/tv_title" and @text="{}"]]')
    # 设备名称
    device_name: (AppiumBy.XPATH,'''//android.widget.GridView[@resource-id="com.xm.support.android:id/recycler_view_service_child_dev"]//android.widget.FrameLayout[@clickable="true" and .//android.widget.TextView[@resource-id="com.xm.support.android:id/tv_model_name" and @text="{}"]]''')
    # 下一步
    next_button: (AppiumBy.XPATH, "//android.view.View[@text='下一步']")
    # 选择蓝牙设备
    select_bluetooth_device: (AppiumBy.XPATH, "//android.widget.TextView[@text='选择蓝牙设备']")
    # 选择我的网络
    select_my_network: (AppiumBy.ID, "com.xm.support.android:id/tv_phone_wifi")
    # 输入wifi名称
    input_wifi_name: (AppiumBy.ID, "com.xm.support.android:id/et_wifi")
    # 输入wifi密码
    input_wifi_password: (AppiumBy.ID, "com.xm.support.android:id/et_password")
    # 手动输入wifi按钮
    manual_input_wifi_button: (AppiumBy.ID, "com.xm.support.android:id/tv_manually_enter")
    # 加入wifi
    join_wifi_button: (AppiumBy.ID, "com.xm.support.android:id/tv_confirm")
    # 连接成功
    connect_success: (AppiumBy.XPATH, "//android.widget.TextView[@text='连接成功']")
    # 连接成功信息2
    connect_success_info2: (AppiumBy.XPATH,'/android.widget.TextView[@text="设置您的设备名称"]')
    # 连接失败
    connect_failed: (AppiumBy.ID, "com.xm.support.android:id/tv_title")
    # 蓝牙设备列表页面标识
    bluetooth_page_identifier: (AppiumBy.ID, "com.xm.support.android:id/lyric_view")
    # wifi配置页标识
    wifi_page_identifier: (AppiumBy.ID, "com.xm.support.android:id/tv_select_tips")
    #配网状态标识
    connect_page_identifier: (AppiumBy.ID, "com.xm.support.android:id/tv_connect_state_tips")
    #确认加入
    confirm_join_wifi: (AppiumBy.ID, "com.xm.support.android:id/tv_confirm")
    # 输入设备名称
    input_device_name: (AppiumBy.ID, "com.xm.support.android:id/et_name")
    # 确定设备名称
    confirm_device_name_button: (AppiumBy.ID, "com.xm.support.android:id/bt_confirm")
    # 安装向导
    install_guide: (AppiumBy.XPATH, '//android.widget.TextView[@text="安装向导"]')
    # 关闭安装先导
    close_install_guide: (AppiumBy.XPATH, '//android.widget.LinearLayout[@resource-id="com.xm.support.android:id/view_title_bar"]/android.widget.LinearLayout/android.widget.ImageView[2]')
  setting_device:
    # 页面标题
    setting_page_title: (AppiumBy.XPATH, '//android.widget.TextView[@text="设置"]')
    # 删除设备
    delect_device: (AppiumBy.XPATH, '//div[text()="删除设备"]')
    # 确认删除设备
    confirm_delect_device: (AppiumBy.XPATH, "/html/body/div[3]/div/div/div/div[3]/div[2]")
    # 设备状态
    device_status: (AppiumBy.XPATH, '//*[@id="app"]/div/div/div/div[1]/div[2]/div[1]/div/span')
    # 设备设置页面标识
    setting_device_page_identifier: (AppiumBy.XPATH, '//android.view.View[@resource-id="app"]/android.view.View[4]')
  video_detail:
    # 加载状态
    loading: (AppiumBy.ID, "com.xm.support.android:id/layout_loading")
    # 出图失败提示
    error_tips: (AppiumBy.XPATH, '//android.widget.TextView[@resource-id="com.xm.support.android:id/tv_tips"]')
    # 静音
    mute_button: (AppiumBy.ID, "com.xm.support.android:id/tv_mute")
    # 截图
    screenshot_button: (AppiumBy.ID, "com.xm.support.android:id/tv_screenshot")
    # 出图状态
    screenshot_status: (AppiumBy.ID, "com.xm.support.android:id/tv_test_violence")
  event:
    error_tips: (AppiumBy.ID, 'com.xm.support.android:id/p2p_error_tips_view')
    error_tips2: (AppiumBy.ID, 'com.xm.support.android:id/tv_sdcard_status')
    # 卡录
    sd_record: (AppiumBy.ID, 'com.xm.support.android:id/tv_sdcard')
    # 视频加载状态
    loading: (AppiumBy.ID, 'com.xm.support.android:id/gif_view')
    # 事件时间
    event_time: (AppiumBy.XPATH, "//android.widget.LinearLayout[@resource-id='com.xm.support.android:id/layout_timeline_time']/android.widget.TextView[@resource-id='com.xm.support.android:id/tv_video_time']")
    # 下载按钮
    download_button: (AppiumBy.ID, "com.xm.support.android:id/iv_download")
    # 录像片段时段
    record_time_period: (AppiumBy.XPATH, '//android.widget.TextView[@resource-id="com.xm.support.android:id/tv_title"]')
    # 下载状态
    download_status: (AppiumBy.ID,"com.xm.support.android:id/tv_tips")
    # ----------下载失败弹窗----------
    # 取消下载
    download_fail_cancel: (AppiumBy.ID,"com.xm.support.android:id/tv_cancel")
    # 重新下载
    download_fail_retry: (AppiumBy.ID,"com.xm.support.android:id/tv_retry")
    # ----------下载成功弹窗----------
    # 确定
    download_success_confirm: (AppiumBy.ID,"com.xm.support.android:id/tv_finish")
    # 分享
    download_success_share: (AppiumBy.ID,"com.xm.support.android:id/tv_share")
  personal_center:
    # 退出登录
    logout_button: (AppiumBy.ID, "com.xm.support.android:id/tv_account_center_loginout")
    # 退出登录弹窗
    logout_message: (AppiumBy.ID, "com.xm.support.android:id/tv_msg_info")
    # 取消退出登录
    cancel_logout_button: (AppiumBy.ID, "com.xm.support.android:id/tv_cancel")
    # 确认退出登录
    confirm_logout_button: (AppiumBy.ID, "com.xm.support.android:id/tv_confirm")